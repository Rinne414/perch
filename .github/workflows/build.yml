name: build

# Tests, type checks and packages Perch on Windows, macOS and Linux.
# When a release is published (by `pnpm run release`, which uploads the Windows installer),
# the macOS and Linux files built from that tag are added to the same release.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm exec electron-vite build

      - name: Package
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No certificates in CI: macOS gets the ad-hoc signature set in electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: perch-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' && matrix.os != 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest-*.yml --clobber
