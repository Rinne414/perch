appId: io.github.rinne414.perch
productName: Perch
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Agents run the hook script with plain Node, which cannot read inside app.asar.
asarUnpack:
  - out/main/perch-hook.js
  - out/main/chunks/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Perch
  artifactName: Perch-Setup-${version}.${ext}
# macOS: one universal app (Apple silicon and Intel). No Apple Developer ID yet, so it is only
# ad-hoc signed ("-"): it runs after the person allows it once in System Settings, and updates
# are downloaded by hand (the app opens the release page). The zip is what latest-mac.yml lists.
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  icon: build/icon.png
  category: public.app-category.productivity
  identity: '-'
  # Hardened runtime only matters for notarization; with an ad-hoc signature it makes macOS refuse
  # to load Electron's own libraries (library validation), so the app would not start.
  hardenedRuntime: false
  artifactName: Perch-${version}-mac.${ext}
# Linux: the AppImage updates itself; the .deb is updated by installing the new one.
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility
  synopsis: A desktop reminder for people who run AI coding agents
  maintainer: Rinne414 <52149077+Rinne414@users.noreply.github.com>
  artifactName: Perch-${version}-linux-${arch}.${ext}
# Written into the app as app-update.yml: 設定 → 檢查更新 reads the latest GitHub release of this repo.
# Windows files are uploaded by `pnpm run release` (scripts/release.mjs); the macOS and Linux ones
# by the CI workflow when that release is published. electron-builder itself never uploads.
publish:
  provider: github
  owner: Rinne414
  repo: perch
  releaseType: release
