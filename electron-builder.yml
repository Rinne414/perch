appId: io.github.rinne414.perch
productName: Perch
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Agents run the hook script with plain Node, which cannot read inside app.asar.
asarUnpack:
  - out/main/perch-hook.js
  - out/main/chunks/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Perch
  artifactName: Perch-Setup-${version}.${ext}
